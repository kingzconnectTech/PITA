<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PITA - Personal Intelligent Technical Assistant</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <!-- Three.js CDN -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="dark-theme">
    <div id="app">
        <!-- 3D Avatar Container -->
        <canvas id="avatar-canvas"></canvas>

        <!-- UI Overlay -->
        <div class="ui-overlay">
            <!-- Header/Status -->
            <header class="glass-panel top-bar">
                <div class="logo">PITA</div>
                <div id="status-indicator" class="status-idle">
                    <span class="status-dot"></span>
                    <span class="status-text">Idle</span>
                </div>
                <button id="dashboard-toggle" class="icon-button">
                    <img src="assets/icons/dashboard.svg" alt="Dashboard" onerror="this.src='https://api.iconify.design/material-symbols:dashboard-rounded.svg?color=white'">
                </button>
            </header>

            <!-- Interaction Area -->
            <main class="interaction-container">
                <div id="response-text" class="glass-panel hidden">
                    <p>How can I assist you today?</p>
                </div>
            </main>

            <!-- Bottom Controls -->
            <footer class="controls-bar">
                <div id="mic-container">
                    <!-- Microphone component will be injected here -->
                </div>
            </footer>
        </div>

        <!-- Global Loader -->
        <div id="loader-container"></div>
        
        <!-- Notifications -->
        <div id="notification-container"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
